name: Diagnose private upload transport
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Compare synthetic uploads
        shell: pwsh
        env:
          UPLOAD_BASE: ${{ secrets.RELEASEHUB_BASE_URL }}
          UPLOAD_APP: ${{ secrets.RELEASEHUB_APP_SLUG }}
          UPLOAD_TOKEN: ${{ secrets.RELEASEHUB_CI_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          try {
            Add-Type -TypeDefinition @'
          using System;
          using System.Net.Http;
          using System.Net.Sockets;
          public static class BufferedUploadClient {
            public static HttpClient Create() {
              var handler = new SocketsHttpHandler { UseProxy = false, ConnectTimeout = TimeSpan.FromSeconds(20) };
              handler.ConnectCallback = async (context, token) => {
                var socket = new Socket(SocketType.Stream, ProtocolType.Tcp) { NoDelay = true, SendBufferSize = 1024 * 1024 };
                try {
                  await socket.ConnectAsync(context.DnsEndPoint, token);
                  return new NetworkStream(socket, true);
                } catch { socket.Dispose(); throw; }
              };
              return new HttpClient(handler) { Timeout = TimeSpan.FromSeconds(120) };
            }
          }
          '@
            $data = [Security.Cryptography.RandomNumberGenerator]::GetBytes(1MB)
            $file = Join-Path $env:RUNNER_TEMP 'synthetic-upload.bin'
            [IO.File]::WriteAllBytes($file, $data)
            $sha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($data)).ToLowerInvariant()
            $version = "0.0.0-ci-probe-$env:GITHUB_RUN_ID"
            $uri = $env:UPLOAD_BASE.TrimEnd('/') + '/internal/v1/apps/' + $env:UPLOAD_APP + '/artifacts'
            $timer = [Diagnostics.Stopwatch]::StartNew()
            & curl.exe --silent --show-error --fail-with-body --connect-timeout 20 --max-time 90 `
              --header "Authorization: Bearer $env:UPLOAD_TOKEN" --form "file=@$file" `
              --form-string "version=$version" --form-string 'channel=ci-probe' `
              --form-string 'artifact_type=package' --form-string "sha256=$sha" `
              $uri > "$env:RUNNER_TEMP/curl-probe.json" 2> "$env:RUNNER_TEMP/curl-probe.log"
            Write-Host ('curl: exit={0}; duration={1:N2}s' -f $LASTEXITCODE,$timer.Elapsed.TotalSeconds)
            $client = [BufferedUploadClient]::Create()
            $form = [Net.Http.MultipartFormDataContent]::new()
            $form.Add([Net.Http.ByteArrayContent]::new($data), 'file', 'synthetic-buffered.bin')
            foreach ($entry in @{version=$version; channel='ci-probe'; artifact_type='package'; sha256=$sha}.GetEnumerator()) {
              $form.Add([Net.Http.StringContent]::new([string]$entry.Value), [string]$entry.Key)
            }
            $client.DefaultRequestHeaders.Authorization = [Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer',$env:UPLOAD_TOKEN)
            $timer.Restart()
            $response = $client.PostAsync($uri,$form).GetAwaiter().GetResult()
            Write-Host ('buffered .NET: status={0}; duration={1:N2}s' -f [int]$response.StatusCode,$timer.Elapsed.TotalSeconds)
            if (!$response.IsSuccessStatusCode) { throw 'Synthetic upload failed.' }
            $response.Dispose(); $form.Dispose(); $client.Dispose()
          } catch {
            Write-Host '::error::Synthetic transport test failed. Private response details were not published.'
            exit 1
          }
